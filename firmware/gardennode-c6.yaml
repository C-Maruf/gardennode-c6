# GardenNode-C6 rev A - ESPHome firmware
# Flash once over USB-C (ESPHome web flasher or `esphome run`), then updates go over the air.
# Wake every 10 min, measure, report to Home Assistant, deep-sleep (~25 uA board + probe leakage).
# Turn on the "Stay awake" switch in Home Assistant to keep the node online for OTA/irrigation.

substitutions:
  name: gardennode
  friendly_name: GardenNode
  sleep_minutes: "10"
  awake_seconds: "25"
  valve_max_minutes: "30"
  # soil probe calibration (volts): measure your probe in dry air and in a glass of water
  soil_dry_v: "2.55"
  soil_wet_v: "1.20"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: open-hardware.gardennode-c6
    version: "A.1"
  on_boot:
    priority: 600
    then:
      - output.turn_on: sensor_rail
      - delay: 300ms
      - script.execute: measure

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light
  ap:
    ssid: "GardenNode Setup"
captive_portal:
improv_serial:

status_led:
  pin:
    number: GPIO11
    inverted: true

deep_sleep:
  id: deep_sleep_ctl
  sleep_duration: ${sleep_minutes}min
  run_duration: ${awake_seconds}s

# ---------- power ----------
output:
  - platform: gpio
    id: sensor_rail          # Q1 P-FET: low = on
    pin: GPIO4
    inverted: true

binary_sensor:
  - platform: gpio
    name: "Charging"
    pin: { number: GPIO18, inverted: true }
    device_class: battery_charging
  - platform: gpio
    name: "External power"
    pin: { number: GPIO19, inverted: true }
    device_class: power

sensor:
  - platform: adc
    id: vbat
    name: "Battery voltage"
    pin: GPIO2
    attenuation: 12db
    samples: 8
    filters: [ multiply: 2.0 ]          # R11/R12 1M:1M
    update_interval: never
    unit_of_measurement: V
    accuracy_decimals: 2
  - platform: template
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    update_interval: never
    id: batt_pct
    lambda: |-
      float v = id(vbat).state;
      float p = (v - 3.30f) / (4.15f - 3.30f) * 100.0f;
      return p < 0 ? 0 : (p > 100 ? 100 : p);
  - platform: adc
    id: vsolar
    name: "Solar voltage"
    pin: GPIO3
    attenuation: 12db
    samples: 4
    filters: [ multiply: 4.0303 ]       # R13/R14 1M:330k
    update_interval: never
    unit_of_measurement: V
    accuracy_decimals: 2
  - platform: adc
    id: soil1_v
    pin: GPIO0
    attenuation: 12db
    samples: 16
    update_interval: never
    internal: true
  - platform: adc
    id: soil2_v
    pin: GPIO1
    attenuation: 12db
    samples: 16
    update_interval: never
    internal: true
  - platform: copy
    source_id: soil1_v
    id: soil1
    name: "Soil moisture 1"
    unit_of_measurement: "%"
    device_class: moisture
    filters:
      - calibrate_linear: [ "${soil_dry_v} -> 0.0", "${soil_wet_v} -> 100.0" ]
      - clamp: { min_value: 0, max_value: 100 }
  - platform: copy
    source_id: soil2_v
    id: soil2
    name: "Soil moisture 2"
    unit_of_measurement: "%"
    device_class: moisture
    filters:
      - calibrate_linear: [ "${soil_dry_v} -> 0.0", "${soil_wet_v} -> 100.0" ]
      - clamp: { min_value: 0, max_value: 100 }
  - platform: dallas_temp
    id: soil_temp
    name: "Soil temperature"
    update_interval: never
  # Qwiic air sensor (Sensirion SHT4x breakout, e.g. Adafruit 4885) - remove if not fitted
  - platform: sht4x
    id: air
    update_interval: never
    temperature: { name: "Air temperature", id: air_t }
    humidity: { name: "Air humidity", id: air_h }
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s

one_wire:
  - platform: gpio
    pin: GPIO5

i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz
  scan: false

# ---------- irrigation valve ----------
switch:
  - platform: gpio
    id: valve
    name: "Valve"
    pin: GPIO10
    icon: mdi:sprinkler-variant
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_ctl
      - delay: ${valve_max_minutes}min      # hard safety limit
      - switch.turn_off: valve
    on_turn_off:
      - if:
          condition: { switch.is_off: stay_awake }
          then: [ deep_sleep.allow: deep_sleep_ctl ]
  - platform: template
    id: stay_awake
    name: "Stay awake"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action: [ deep_sleep.prevent: deep_sleep_ctl ]
    turn_off_action:
      - if:
          condition: { switch.is_off: valve }
          then: [ deep_sleep.allow: deep_sleep_ctl ]

script:
  - id: measure
    then:
      - component.update: vbat
      - component.update: batt_pct
      - component.update: vsolar
      - component.update: soil1_v
      - component.update: soil2_v
      - component.update: soil_temp
      - component.update: air
      - delay: 1s
      - if:
          condition: { switch.is_off: valve }
          then: [ output.turn_off: sensor_rail ]

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
  - platform: template
    name: "Measure now"
    on_press:
      - output.turn_on: sensor_rail
      - delay: 300ms
      - script.execute: measure
